name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Continuous Deployment (CD) to Azure VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/vault-app
            # If repo is already a git repo, pull latest; otherwise sync
            if [ -d .git ]; then
              git pull origin main
            else
              echo "Setting up git repository in vault-app..."
              git init
              git remote add origin https://github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            fi
            
            # Rebuild and restart the container
            docker compose build --no-cache
            docker compose up -d
            echo "🚀 Deployment successfully completed on Azure VM!"
